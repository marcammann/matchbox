[project]
name = "matchbox"
version = "0.1.0"
description = "Matchbox — AI-powered job search agent that finds roles, matches to your profile, and tailors applications"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "anthropic>=0.52",
    "markdown>=3.7",
    "weasyprint>=63",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.14.3",
    "pyyaml>=6.0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "langchain-anthropic>=0.3",
]

[project.scripts]
matchbox = "job_search.main:main"
matchbox-web = "job_search.api:serve"

[tool.hatch.build.targets.wheel]
packages = ["job_search"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
